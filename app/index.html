<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal · Agents Back Office</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="/assets/abo.js"></script>
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <a class="brand" href="/app/">Agents Back Office</a>
    <nav id="nav">
      <a href="#transactions" data-r="transactions">Transactions</a>
      <a href="#clients" data-r="clients">Clients</a>
      <a href="#profile" data-r="profile">Profile</a>
      <a href="#feedback" data-r="feedback">Feedback</a>
      <a href="/preview.html">Preview</a>
      <a href="#" id="signout">Sign out</a>
    </nav>
  </header>
  <div id="msg" class="msg hidden"></div>
  <main id="main"><p class="muted">Loading…</p></main>
  <footer>Signed in as <span id="who"></span>. An agent sees only their own transactions and clients. <a href="/">About the service</a></footer>
</div>

<script>
(async function () {
  const { sb, $, $$, esc, fmtDate, fmtWhen, STATUS, OPEN_STATUSES, msg, audit, reverify, csv, download } = ABO;
  const st = await ABO.requireSession(); if (!st) return;
  const me = st.profile; const uid = st.session.user.id;
  $("#who").textContent = me.full_name || me.email;
  if (me.role === "admin") $("#nav").insertAdjacentHTML("afterbegin", '<a href="/admin/">Back office</a>');
  const M = $("#msg"), main = $("#main");
  $("#signout").addEventListener("click", (e) => { e.preventDefault(); ABO.signOut(false); });

  const PACKET_URL = "https://claude.ai/artifact/AgL8ke7iGH4mZ1SDbK3uLf";   // the Driveway Packet page, until the builder moves inside
  const SIDES = { buyer: "Buyer", seller: "Seller", both: "Both sides", landlord: "Landlord", tenant: "Tenant" };
  const ROLES = { buyer: "Buyer", seller: "Seller", tenant: "Tenant", landlord: "Landlord", other: "Other" };
  const FB_CATS = { general: "General", urgent: "Urgent", feature: "Feature Request", bug: "Report a Bug", support: "Questions and Support" };
  const tag = (s) => `<span class="tag ${OPEN_STATUSES.includes(s) ? (s === "waiting_on_agent" ? "warn" : "ok") : ""}">${esc(STATUS[s] || s)}</span>`;

  async function load(table, q) { const { data, error } = await q; if (error) { msg(M, error.message, "err"); return []; } return data || []; }

  // ---------------- transactions ----------------
  async function viewTransactions(mode) {
    mode = mode || localStorage.getItem("abo.tx") || "open";
    try { localStorage.setItem("abo.tx", mode); } catch (e) {}
    let q = sb.from("transactions").select("*").order("opened_at", { ascending: false });
    if (mode === "open") q = q.in("status", OPEN_STATUSES);
    const rows = await load("transactions", q);
    main.innerHTML = `
      <div class="item"><h1>Transactions</h1><a class="btn" href="${PACKET_URL}" target="_blank" rel="noopener">Send a new transaction</a></div>
      <div class="tabs"><button data-m="open" class="${mode === "open" ? "on" : ""}">Open</button><button data-m="all" class="${mode === "all" ? "on" : ""}">All</button></div>
      ${rows.length ? `<ul class="list">${rows.map(t => `
        <li><div class="item"><a class="title" href="#t/${t.id}">${esc(t.property_label || t.property_address || "Untitled transaction")}</a>${tag(t.status)}</div>
        <div class="small muted">${esc(SIDES[t.side] || "")}${t.property_label && t.property_address ? " · " + esc(t.property_address) : ""} · opened ${fmtDate(t.opened_at)}${t.latest_update ? " · " + esc(t.latest_update) : ""}</div></li>`).join("")}</ul>`
        : `<p class="muted">${mode === "open" ? "No open transactions." : "No transactions yet."} When you send a packet it appears here with its status.</p>`}
      <p class="notice">The packet page still opens in its own tab while the builder moves inside the portal. Your profile details will fill in automatically once it does.</p>`;
    $$(".tabs button", main).forEach(b => b.addEventListener("click", () => viewTransactions(b.dataset.m)));
  }

  async function viewTransaction(id) {
    const [t] = await load("transactions", sb.from("transactions").select("*").eq("id", id).limit(1));
    if (!t) { main.innerHTML = "<p>Not found.</p>"; return; }
    const versions = await load("packet_versions", sb.from("packet_versions").select("id,version_no,catalog_version,forms,submitted_at,queue_state,answers").eq("transaction_id", id).order("version_no", { ascending: false }));
    const parties = await load("transaction_clients", sb.from("transaction_clients").select("role, clients(id, full_name, phone, email)").eq("transaction_id", id));
    const dates = Object.entries(t.key_dates || {});
    main.innerHTML = `
      <p><a href="#transactions" class="small">← Transactions</a></p>
      <div class="item"><h1>${esc(t.property_label || t.property_address || "Transaction")}</h1>${tag(t.status)}</div>
      <p class="muted">${esc(SIDES[t.side] || "")}${t.property_address ? " · " + esc(t.property_address) : ""} · opened ${fmtDate(t.opened_at)}${t.closed_at ? " · closed " + fmtDate(t.closed_at) : ""}</p>
      ${t.latest_update ? `<div class="card flat"><p class="eyebrow">Latest update</p><p style="margin:0">${esc(t.latest_update)}</p></div>` : ""}
      <div class="grid">
        <div class="card"><h3 style="margin-top:0">Key dates</h3>${dates.length ? `<dl class="kv">${dates.map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(fmtDate(v) || v)}</dd>`).join("")}</dl>` : '<p class="muted small">None recorded yet.</p>'}</div>
        <div class="card"><h3 style="margin-top:0">Parties</h3>${parties.length ? `<ul class="list">${parties.map(p => `<li><a href="#clients" class="title">${esc(p.clients.full_name)}</a> <span class="tag">${esc(ROLES[p.role] || "")}</span><div class="small muted">${esc([p.clients.phone, p.clients.email].filter(Boolean).join(" · "))}</div></li>`).join("")}</ul>` : '<p class="muted small">No parties linked yet.</p>'}</div>
      </div>
      <div class="item"><h2>Packet versions</h2><a class="btn small" href="${PACKET_URL}" target="_blank" rel="noopener">Add to this transaction</a></div>
      ${versions.length ? versions.map(v => `
        <details class="card"><summary><strong>Version ${v.version_no}</strong> · ${fmtWhen(v.submitted_at)} · ${esc((v.forms || []).join(", ") || "forms not listed")}${v.catalog_version ? " · catalog " + esc(v.catalog_version) : ""}</summary>
          ${renderAnswers(v.answers)}</details>`).join("") : '<p class="muted">No packet versions on this transaction yet.</p>'}`;
  }
  function renderAnswers(a) {
    if (!a || typeof a !== "object" || !Object.keys(a).length) return '<p class="muted small">No answers stored.</p>';
    return Object.entries(a).map(([form, fields]) => `<h3>${esc(form)}</h3><dl class="kv">${Object.entries(fields && typeof fields === "object" ? fields : { value: fields }).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</dd>`).join("")}</dl>`).join("");
  }

  // ---------------- clients ----------------
  async function viewClients(filter) {
    filter = filter || localStorage.getItem("abo.cl") || "active";
    try { localStorage.setItem("abo.cl", filter); } catch (e) {}
    const clients = await load("clients", sb.from("clients").select("*").order("full_name"));
    const links = await load("transaction_clients", sb.from("transaction_clients").select("client_id, transactions(id, status, closed_at, opened_at, property_label)"));
    const byClient = {}; links.forEach(l => { (byClient[l.client_id] = byClient[l.client_id] || []).push(l.transactions); });
    const months = { "6m": 6, "1y": 12 }[filter];
    const since = months ? new Date(Date.now() - months * 30.44 * 86400000) : null;
    const rows = clients.filter(c => {
      const ts = byClient[c.id] || [];
      if (filter === "active") return ts.some(t => t && OPEN_STATUSES.includes(t.status));
      if (since) return ts.some(t => t && new Date(t.closed_at || t.opened_at) >= since) || new Date(c.created_at) >= since;
      return true;
    });
    const labels = { active: "Active", "6m": "6 months", "1y": "1 year", all: "All" };
    const [wipe] = await load("wipe_requests", sb.from("wipe_requests").select("*").is("cancelled_at", null).is("executed_at", null).order("requested_at", { ascending: false }).limit(1));
    main.innerHTML = `
      <div class="item"><h1>Clients</h1><div class="actions" style="margin:0"><button class="btn ghost small" id="add">Add a client</button><button class="btn ghost small" id="import">Import CSV</button><button class="btn small" id="export">Export CSV</button></div></div>
      <p class="small muted">It's your data. We are just holding it. We won't use it for anything other than assisting you, personally.${wipe ? "" : ' <a href="#" id="wipe-open">Erase my client list</a>'}</p>
      ${wipe ? `<div class="msg err"><strong>Client-list wipe ${wipe.confirmed_at ? "scheduled for " + fmtDate(wipe.scheduled_for) : "requested " + fmtDate(wipe.requested_at) + ", waiting for your email confirmation"}.</strong> ${wipe.confirmed_at ? "Clients attached to an open transaction are kept until it closes, then erased." : "Open the link we emailed you to confirm."} <a href="#" id="wipe-cancel">Cancel the wipe</a></div>` : ""}
      <div id="wipebox" class="card hidden"><h3 style="margin-top:0">Erase my client list</h3>
        <p class="small muted">This asks us to erase every client on your account. You confirm it from a link we email you; it is then reviewed to make sure no active transactions are in place and carried out 30 days after your confirmation unless you or we stop it. Clients on an open transaction are kept until it closes. Enter your authenticator code to start.</p>
        <form id="f-wipe"><label>Six-digit code</label><input id="wcode" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required><div class="actions"><button class="btn danger" type="submit">Send me the confirmation email</button><button class="btn ghost" type="button" id="wcancel">Never mind</button></div></form></div>
      <div id="importbox" class="card hidden"><h3 style="margin-top:0">Import clients from a CSV</h3>
        <p class="small muted">Download the blank template, fill one row per person, then choose the file. Columns: Name (required), Role (buyer, seller, tenant, landlord, other), Phone, Email, Address, Notes. A row that matches one of your clients by name, email or phone updates that client with what changed; an identical row is dropped; every change is kept in the history.</p>
        <div class="actions"><button class="btn ghost small" type="button" id="template">Download the blank template</button><input type="file" id="csvfile" accept=".csv,text/csv" style="flex:1 1 14rem"><button class="btn small" type="button" id="doimport" disabled>Import</button></div>
        <div id="importpreview" class="small muted"></div></div>
      <div class="tabs">${Object.entries(labels).map(([k, v]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${v}</button>`).join("")}</div>
      <div id="addform" class="card hidden"><h3 style="margin-top:0">New client</h3><form id="f-add"><div class="row">
        <div><label>Name</label><input name="full_name" required></div><div><label>Role</label><select name="role">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div></div>
        <div class="row"><div><label>Phone</label><input name="phone" type="tel"></div><div><label>Email</label><input name="email" type="email"></div></div>
        <label>Address</label><input name="address">
        <label>Notes</label><textarea name="notes"></textarea><div class="actions"><button class="btn" type="submit">Save</button></div></form></div>
      <div id="exportbox" class="card hidden"><h3 style="margin-top:0">Confirm the export</h3><p class="muted small">Exporting your client list needs a fresh code from your authenticator app. The export is recorded and we will confirm it by email${me.sms_opt_in && me.phone ? " and text" : ""}.</p>
        <form id="f-export"><label>Six-digit code</label><input id="xcode" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required><div class="actions"><button class="btn" type="submit">Download ${rows.length} row${rows.length === 1 ? "" : "s"}</button><button class="btn ghost" type="button" id="xcancel">Cancel</button></div></form></div>
      ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Email</th><th>Address</th><th>Transactions</th></tr></thead><tbody>
        ${rows.map(c => `<tr><td>${esc(c.full_name)}</td><td>${esc(ROLES[c.role] || "")}</td><td>${esc(c.phone || "")}</td><td>${esc(c.email || "")}</td><td class="small">${esc(c.address || "")}</td><td class="small">${(byClient[c.id] || []).filter(Boolean).map(t => `<a href="#t/${t.id}">${esc(t.property_label || "transaction")}</a>`).join(", ")}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="muted">${filter === "active" ? "No clients in open transactions." : "No clients in this range."} Clients are added from your entries and from the buttons above.</p>`}`;
    $$(".tabs button", main).forEach(b => b.addEventListener("click", () => viewClients(b.dataset.f)));
    $("#add").addEventListener("click", () => $("#addform").classList.toggle("hidden"));
    $("#f-add").addEventListener("submit", async (e) => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target).entries());
      Object.keys(f).forEach(k => { if (f[k] === "") f[k] = null; });
      const { error } = await sb.from("clients").insert({ ...f, agent_id: uid });
      if (error) { msg(M, error.message, "err"); return; }
      msg(M, "Client saved.", "ok"); viewClients(filter);
    });
    // ---- CSV import: blank template, parse in the browser, insert under this agent ----
    $("#import").addEventListener("click", () => $("#importbox").classList.toggle("hidden"));
    $("#template").addEventListener("click", () => download("clients-template.csv", "Name,Role,Phone,Email,Address,Notes\r\n"));
    let plan = null;
    $("#csvfile").addEventListener("change", async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const table = parseCsv(await file.text());
      if (!table.length) { $("#importpreview").textContent = "That file is empty."; return; }
      const head = table[0].map(h => h.trim().toLowerCase());
      const col = (n) => head.indexOf(n);
      if (col("name") < 0) { $("#importpreview").textContent = "The first row must have a Name column (use the template)."; plan = null; $("#doimport").disabled = true; return; }
      const roles = Object.keys(ROLES);
      const norm = (s) => (s || "").trim().toLowerCase();
      const digits = (s) => (s || "").replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
      const cell = (r, n) => col(n) >= 0 ? (r[col(n)] || "").trim() || null : null;
      const byName = {}, byEmail = {}, byPhone = {};
      clients.forEach(c => { byName[norm(c.full_name)] = c; if (c.email) byEmail[norm(c.email)] = c; if (digits(c.phone)) byPhone[digits(c.phone)] = c; });
      plan = { inserts: [], updates: [], same: 0 };
      for (const r of table.slice(1)) {
        if (!r.some(v => v && v.trim())) continue;
        const x = { full_name: (r[col("name")] || "").trim(), role: roles.includes(norm(cell(r, "role"))) ? norm(cell(r, "role")) : null,
                    phone: cell(r, "phone"), email: cell(r, "email"), address: cell(r, "address"), notes: cell(r, "notes") };
        if (!x.full_name) continue;
        const m = byName[norm(x.full_name)] || (x.email && byEmail[norm(x.email)]) || (digits(x.phone) && byPhone[digits(x.phone)]);
        if (!m) { plan.inserts.push(x); continue; }
        const upd = {};
        for (const f of ["role", "phone", "email", "address", "notes"]) if (x[f] && x[f] !== (m[f] || "")) upd[f] = x[f];
        if (x.full_name !== m.full_name) upd.full_name = x.full_name;   // matched by email or phone under a changed name
        if (Object.keys(upd).length) plan.updates.push({ id: m.id, upd }); else plan.same++;
      }
      const n = plan.inserts.length + plan.updates.length;
      $("#importpreview").textContent = `${plan.inserts.length} new, ${plan.updates.length} to update, ${plan.same} identical (dropped), from ${table.length - 1} rows.`;
      $("#doimport").disabled = !n;
    });
    $("#doimport").addEventListener("click", async () => {
      if (!plan) return; $("#doimport").disabled = true;
      if (plan.inserts.length) {
        const { error } = await sb.from("clients").insert(plan.inserts.map(x => ({ ...x, agent_id: uid })));
        if (error) { msg(M, error.message, "err"); $("#doimport").disabled = false; return; }
      }
      let updated = 0;
      for (const u of plan.updates) { const { error } = await sb.from("clients").update(u.upd).eq("id", u.id); if (!error) updated++; else msg(M, error.message, "err"); }
      await audit("import_clients", { inserted: plan.inserts.length, updated, unchanged: plan.same });
      msg(M, `Imported: ${plan.inserts.length} new, ${updated} updated, ${plan.same} unchanged.`, "ok"); viewClients("all");
    });
    const wo = $("#wipe-open"); if (wo) wo.addEventListener("click", (e) => { e.preventDefault(); $("#wipebox").classList.remove("hidden"); $("#wcode").focus(); });
    $("#wcancel").addEventListener("click", () => $("#wipebox").classList.add("hidden"));
    $("#f-wipe").addEventListener("submit", async (e) => {
      e.preventDefault(); msg(M, "");
      try { await reverify($("#wcode").value.trim()); } catch (err) { msg(M, "That code did not match. Try the current one.", "err"); $("#wcode").value = ""; return; }
      try { await ABO.fn("wipe", { action: "request" }); msg(M, "Check your email for the confirmation link. Nothing is erased until you confirm, and then not for 30 days.", "ok"); viewClients(filter); }
      catch (err) { msg(M, err.message, "err"); }
    });
    const wc = $("#wipe-cancel"); if (wc) wc.addEventListener("click", async (e) => {
      e.preventDefault();
      try { await ABO.fn("wipe", { action: "cancel", id: wipe.id }); msg(M, "The wipe is cancelled. Your clients stay as they are.", "ok"); viewClients(filter); }
      catch (err) { msg(M, err.message, "err"); }
    });
    $("#export").addEventListener("click", () => { $("#exportbox").classList.remove("hidden"); $("#xcode").focus(); });
    $("#xcancel").addEventListener("click", () => $("#exportbox").classList.add("hidden"));
    $("#f-export").addEventListener("submit", async (e) => {
      e.preventDefault(); msg(M, "");
      try { await reverify($("#xcode").value.trim()); }
      catch (err) { msg(M, "That code did not match. Try the current one.", "err"); $("#xcode").value = ""; return; }
      const text = csv(rows, [{ key: "full_name", label: "Name" }, { label: "Role", get: r => ROLES[r.role] || "" }, { key: "phone", label: "Phone" }, { key: "email", label: "Email" }, { key: "address", label: "Address" },
        { label: "Transactions", get: r => (byClient[r.id] || []).filter(Boolean).map(t => t.property_label || "").join("; ") }, { key: "notes", label: "Notes" }]);
      download(`clients-${filter}-${new Date().toISOString().slice(0, 10)}.csv`, text);
      await audit("export_clients", { filter, rows: rows.length });
      try { await ABO.fn("notify", { event: "export_clients", rows: rows.length, filter }); } catch (err) { /* confirmation is best-effort */ }
      $("#exportbox").classList.add("hidden"); msg(M, `Exported ${rows.length} rows. The export is recorded on your account.`, "ok");
    });
  }

  // CSV parser: quotes, doubled quotes, commas and newlines inside quotes
  function parseCsv(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.length > 1 || (r[0] && r[0].trim()));
  }

  // ---------------- profile ----------------
  async function viewProfile() {
    const [p] = await load("profiles", sb.from("profiles").select("*").eq("id", uid).limit(1));
    const { data: f } = await sb.auth.mfa.listFactors();
    const totp = (f && f.totp) || [];
    const recent = await load("audit_log", sb.from("audit_log").select("at, action, details").eq("actor", uid).order("at", { ascending: false }).limit(15));
    const established = totp.length > 0 && (Date.now() - new Date(p.created_at).getTime()) > 7 * 86400000;
    main.innerHTML = `
      <h1>Your profile</h1>
      <form id="f-profile" class="card">
        <div class="row"><div><label>Your name</label><input name="full_name" value="${esc(p.full_name || "")}"></div><div><label>Your OREC license #</label><input name="license_no" value="${esc(p.license_no || "")}"></div></div>
        <div class="row"><div><label>Phone</label><input name="phone" type="tel" value="${esc(p.phone || "")}"></div><div><label>Email</label><input value="${esc(p.email)}" disabled></div></div>
        <div class="row"><div><label>Brokerage</label><input name="brokerage" value="${esc(p.brokerage || "")}"></div><div><label>I usually represent the</label><select name="represents_default"><option value="">—</option>${["buyer", "seller", "both"].map(v => `<option value="${v}" ${p.represents_default === v ? "selected" : ""}>${SIDES[v]}</option>`).join("")}</select></div></div>
        <label style="display:flex;gap:.5rem;align-items:center;margin-top:1rem"><input type="checkbox" name="sms_opt_in" style="width:auto" ${p.sms_opt_in ? "checked" : ""}> Text me confirmations and status updates at the phone above (standard rates; reply STOP to end).</label>
        <div class="actions"><button class="btn" type="submit">Save</button></div>
      </form>
      <div class="grid">
        <div class="card"><h3 style="margin-top:0">Password</h3><p class="small muted">Password changes require the safety of an email link to better protect your clients.</p><button class="btn ghost small" id="pwreset">Email me a reset link</button></div>
        <div class="card"><h3 style="margin-top:0">Authenticator app</h3><p class="small muted">${totp.length ? `On since ${fmtDate(totp[0].created_at)}.` : "Not enrolled."}${p.mfa_required === false ? " An administrator has cleared the requirement for this account." : ""}</p>
          ${totp.length ? "" : '<a class="btn ghost small" href="/login/">Set it up</a>'}</div>
        <div class="card"><h3 style="margin-top:0">Sessions</h3><p class="small muted">Sign your account out everywhere. That will include this session.</p><button class="btn ghost small" id="signout-all">Sign out everywhere</button></div>
        <div class="card"><h3 style="margin-top:0">Email</h3><p class="small muted">In a modern environment, we take the information you trust us with extremely seriously. Changing your e-mail will require a 2FA authentication code and a confirmation from the new address. Contact us directly if any of those requirements cannot be met.</p>
          ${established ? `<form id="f-email"><label>New email</label><input name="new_email" type="email" required><label>Six-digit code</label><input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required><div class="actions"><button class="btn ghost small" type="submit">Request the change</button></div></form>`
                        : '<p class="small muted">Accounts must be over a week old to change e-mail addresses. Let us know if you require it sooner.</p>'}</div>
      </div>
      <h2>Recent activity on your account</h2>
      ${recent.length ? `<div class="tablewrap"><table><thead><tr><th>When</th><th>What</th><th>Details</th></tr></thead><tbody>${recent.map(r => `<tr><td>${fmtWhen(r.at)}</td><td>${esc(r.action.replace(/_/g, " "))}</td><td class="small muted">${esc(summarize(r.details))}</td></tr>`).join("")}</tbody></table></div>` : '<p class="muted">Nothing yet.</p>'}`;
    $("#f-profile").addEventListener("submit", async (e) => {
      e.preventDefault(); const fd = new FormData(e.target); const f = Object.fromEntries(fd.entries()); f.sms_opt_in = fd.get("sms_opt_in") === "on";
      Object.keys(f).forEach(k => { if (f[k] === "") f[k] = null; });
      const { error } = await sb.from("profiles").update(f).eq("id", uid);
      msg(M, error ? error.message : "Saved.", error ? "err" : "ok");
    });
    $("#pwreset").addEventListener("click", async () => {
      const { error } = await sb.auth.resetPasswordForEmail(p.email, { redirectTo: "https://agentsbackoffice.com/login/" });
      msg(M, error ? error.message : "Reset link sent to " + p.email + ".", error ? "err" : "ok");
    });
    $("#signout-all").addEventListener("click", () => ABO.signOut(true));
    const fe = $("#f-email");
    if (fe) fe.addEventListener("submit", async (e) => {
      e.preventDefault(); msg(M, ""); const fd = new FormData(e.target); const newEmail = (fd.get("new_email") || "").trim().toLowerCase();
      if (newEmail === p.email.toLowerCase()) { msg(M, "That is already your email.", "err"); return; }
      try { await reverify((fd.get("code") || "").trim()); } catch (err) { msg(M, "That code did not match. Try the current one.", "err"); return; }
      const { error } = await sb.auth.updateUser({ email: newEmail }, { emailRedirectTo: "https://agentsbackoffice.com/login/" });
      if (error) { msg(M, error.message, "err"); return; }
      await audit("email_change_requested", { to: newEmail });
      try { await ABO.fn("notify", { event: "email_change_requested", new_email: newEmail }); } catch (err) { /* best-effort */ }
      msg(M, "A confirmation link was sent to " + newEmail + ". The change completes once it is confirmed.", "ok");
    });
  }
  function summarize(d) { if (!d || typeof d !== "object") return ""; const o = { ...d }; delete o.ua; return Object.entries(o).map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join(", ").slice(0, 140); }

  async function viewWipeConfirm(token) {
    main.innerHTML = '<h1>Confirming…</h1>';
    try {
      const r = await ABO.fn("wipe", { action: "confirm", token });
      main.innerHTML = `<h1>Wipe confirmed</h1><p>Your client list is scheduled to be erased on <strong>${fmtDate(r.scheduled_for)}</strong>.${r.open_transactions ? ` You have ${r.open_transactions} open transaction${r.open_transactions === 1 ? "" : "s"}; clients attached to them are kept until they close.` : ""} We will review it in the meantime. You can cancel any time from the <a href="#clients">Clients tab</a>.</p>`;
    } catch (err) { main.innerHTML = `<h1>Could not confirm</h1><p>${esc(err.message)}</p><p><a href="#clients">Back to Clients</a></p>`; }
  }

  // ---------------- feedback ----------------
  let showOlder = false;
  async function viewFeedback() {
    const tx = await load("transactions", sb.from("transactions").select("id, property_label, property_address").order("opened_at", { ascending: false }).limit(50));
    const mine = await load("feedback", sb.from("feedback").select("*").order("created_at", { ascending: false }).limit(30));
    const name = (id) => { const t = tx.find(x => x.id === id); return t ? (t.property_label || t.property_address || "transaction") : ""; };
    const cutoff = Date.now() - 30 * 86400000;
    const recentFb = mine.filter(f => new Date(f.created_at).getTime() >= cutoff), older = mine.filter(f => new Date(f.created_at).getTime() < cutoff);
    main.innerHTML = `
      <h1>Feedback</h1><p class="muted">Tell us what works, what does not work, or what work you wish it would do. It lands with us directly.</p>
      <form id="f-fb" class="card"><div class="row">
        <div><select name="category">${Object.entries(FB_CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
        <div><select name="transaction_id"><option value="">Not about one transaction</option>${tx.map(t => `<option value="${t.id}">${esc(t.property_label || t.property_address || "transaction")}</option>`).join("")}</select></div></div>
        <label>Your note</label><textarea name="body" required></textarea>
        <label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" name="wants_followup" style="width:auto"> I would like a follow-up</label>
        <div class="actions"><button class="btn" type="submit">Send</button></div></form>
      ${mine.length ? `<h2>Sent</h2>${older.length && !showOlder ? `<p class="small muted">Showing the last 30 days. <a href="#" id="fb-older">Show ${older.length} older</a></p>` : ""}<ul class="list">${(showOlder ? mine : recentFb).map(f => `<li><div class="item"><span class="small muted"><span class="tag ${f.category === "urgent" ? "bad" : ""}">${esc(FB_CATS[f.category] || f.category)}</span> ${fmtWhen(f.created_at)}${f.transaction_id ? " · " + esc(name(f.transaction_id)) : ""}</span>${f.handled_at ? '<span class="tag ok">Seen</span>' : '<span class="tag">Sent</span>'}${f.wants_followup ? ' <span class="tag">Follow-up asked</span>' : ""}</div><div>${esc(f.body)}</div></li>`).join("")}</ul>` : ""}`;
    const fo = $("#fb-older"); if (fo) fo.addEventListener("click", (e) => { e.preventDefault(); showOlder = true; viewFeedback(); });
    $("#f-fb").addEventListener("submit", async (e) => {
      e.preventDefault(); const fd = new FormData(e.target); const f = Object.fromEntries(fd.entries()); if (!f.transaction_id) f.transaction_id = null; f.wants_followup = fd.get("wants_followup") === "on";
      const { data, error } = await sb.from("feedback").insert({ ...f, agent_id: uid, channel: "web" }).select("id").single();
      if (error) { msg(M, error.message, "err"); return; }
      if (f.category === "urgent") { try { await ABO.fn("notify", { event: "feedback_urgent", feedback_id: data.id }); } catch (err) { /* the row is saved regardless */ } }
      msg(M, f.category === "urgent" ? "Sent and flagged urgent. We have been notified." : "Thank you. It has been sent.", "ok"); viewFeedback();
    });
  }

  // ---------------- router ----------------
  async function route() {
    msg(M, "");
    const h = location.hash.replace(/^#/, "") || "transactions";
    const r = h.split("/")[0];
    $$("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === r));
    main.innerHTML = '<p class="muted">Loading…</p>';
    if (r === "t" && h.split("/")[1]) return viewTransaction(h.split("/")[1]);
    if (r === "wipe" && h.split("/")[1]) return viewWipeConfirm(h.split("/")[1]);
    if (r === "clients") return viewClients();
    if (r === "profile") return viewProfile();
    if (r === "feedback") return viewFeedback();
    return viewTransactions();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
