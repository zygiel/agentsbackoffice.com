<title>Packet · Agents Back Office</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="/assets/abo.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F4F3EF; --surface:#FFFFFF; --ink:#1F2328; --ink-2:#5B6069; --ink-3:#8A8F98;
  --line:#D9D5CC; --line-2:#EAE7E0; --accent:#8B2F5C; --accent-ink:#FFFFFF; --accent-soft:#F3E4EC;
  --ok:#2E7D5B; --ok-soft:#E3F1EA; --warn:#9A6700; --warn-soft:#FFF3D6;
  --display:"Zilla Slab", Georgia, "Times New Roman", serif;
  --body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#171A1F; --surface:#1F2329; --ink:#E8E6E1; --ink-2:#A9AEB7; --ink-3:#7C818A;
    --line:#33383F; --line-2:#2A2E35; --accent:#D67AA8; --accent-ink:#1A0A12; --accent-soft:#3A2431;
    --ok:#5DBB8E; --ok-soft:#1E3A2E; --warn:#E0B24A; --warn-soft:#3A3120;
  }
}
:root[data-theme="dark"]{
  --ground:#171A1F; --surface:#1F2329; --ink:#E8E6E1; --ink-2:#A9AEB7; --ink-3:#7C818A;
  --line:#33383F; --line-2:#2A2E35; --accent:#D67AA8; --accent-ink:#1A0A12; --accent-soft:#3A2431;
  --ok:#5DBB8E; --ok-soft:#1E3A2E; --warn:#E0B24A; --warn-soft:#3A3120;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding-block:0 96px;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:680px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--ground);padding-block:12px 8px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
header.top .row{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.01em}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink-3);margin-left:8px;letter-spacing:.04em}
.where{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.topright{display:flex;align-items:center;gap:10px}
.ticks{max-width:680px;margin:8px auto 0;display:flex;gap:4px}
.ticks i{flex:1;height:3px;background:var(--line);border-radius:2px}
.ticks i.done{background:var(--accent)}
.ticks i.now{background:var(--accent);opacity:.55}

h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;margin:24px 0 4px;text-wrap:balance}
h3.group{font:600 12px/1.3 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
p.lede{color:var(--ink-2);margin:0 0 16px;max-width:60ch}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card+.card{margin-top:10px}
.pick{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:8px}
.pick input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.pick .t{font-weight:600}
.pick .s{color:var(--ink-2);font-size:14px}
.pick .tag{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px}
.pick.auto{border-style:dashed}
.exclusive{display:flex;flex-direction:column;gap:6px}

.field{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.field:last-child{border-bottom:0}
.field label,.field .lab{font-size:14px;font-weight:500}
.field .from{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:3px;margin-left:6px;font-weight:400;white-space:nowrap}
.field .hint{font-size:13px;color:var(--ink-3)}
.field .unc{font-family:var(--mono);font-size:10px;color:var(--warn);margin-left:6px}
.pre{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.pre:last-child{border-bottom:0}
.pre .k{color:var(--ink-2)}
.pre .v{font-weight:500;text-align:right;overflow-wrap:anywhere}
.pre .v.empty{color:var(--ink-3);font-weight:400}
.pre button{border:0;background:none;color:var(--accent);font-size:13px;padding:0 0 0 8px;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:0}
.in{display:flex;align-items:center;gap:6px}
.in .unit{font-family:var(--mono);color:var(--ink-3);font-size:14px;min-width:1ch}
input[type=text],input[type=date],input[type=email],input[type=tel],textarea,select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg label.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle{display:flex;gap:10px;align-items:center}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.party{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 12px;margin-top:8px;display:grid;grid-template-columns:1fr;gap:6px}
.party .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:420px){.party .row2{grid-template-columns:1fr}}
.party .rm{justify-self:end;border:0;background:none;color:var(--ink-3);font-size:13px;padding:0}

details.sec{margin:0 0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.sec summary{padding:9px 14px;font-weight:500;font-size:13px;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .arrow{display:inline-block;transition:transform .15s;color:var(--accent)}
details.sec[open] summary .arrow{transform:rotate(90deg)}
details.sec .text{padding:0 16px 14px;font-size:14px;line-height:1.55;max-height:60vh;overflow:auto;border-top:1px solid var(--line-2)}
.text h1,.text h2,.text h3{font-family:var(--display);font-size:16px;margin:16px 0 6px}
.text blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--ink-2);font-size:13px}
.text pre{font:12px/1.4 var(--mono);white-space:pre;overflow-x:auto;background:var(--ground);padding:8px;border-radius:4px}
.text p{margin:8px 0}
.text ul{margin:6px 0 8px 22px;padding:0}
.text li{margin:2px 0}
.hide-done #main .done, .hide-done #main details.grp.full{display:none}
.text mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:2px}

.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.pill.accent{border-color:var(--accent);color:var(--accent)}
.pill.quiet{border-color:transparent;color:var(--ink-3)}
.note{background:var(--warn-soft);border:1px solid transparent;border-radius:var(--r);padding:10px 12px;font-size:14px;color:var(--ink)}
.status{font-size:14px;color:var(--ink-2);margin-top:8px;min-height:1.3em}

nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;z-index:6}
nav.bottom .row{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
nav.bottom .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

.review .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.review .row:last-child{border-bottom:0}
.review .n{font-family:var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
textarea.payload{font:12px/1.4 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:160px;max-height:40vh}
.small{font-size:13px;color:var(--ink-3)}
.hidden{display:none!important}

/* v3: wording IDs, per-field legal wording, folding sections */
.idtag{display:none;font:500 10px/1.4 var(--mono);color:var(--warn);background:var(--warn-soft);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle;user-select:all;white-space:nowrap;letter-spacing:0;text-transform:none}
body.ids .idtag{display:inline-block}
.pill.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.labrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.labrow > :first-child{flex:1;min-width:0}
.lw{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;font:600 12px/1 var(--mono);width:26px;height:22px;padding:0}
.lw[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legal{margin-top:4px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--ground);border-radius:0 var(--r) var(--r) 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
.legal p{margin:0 0 6px}
.legal p:last-child{margin-bottom:0}
.legal mark.here{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 6px}
.legal .cap{font:500 11px/1.3 var(--mono);color:var(--ink-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.pre .lw{margin-left:8px}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
details.grp > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
details.grp > summary::-webkit-details-marker{display:none}
details.grp > summary .gt{flex:1;font-weight:600;font-size:14px}
details.grp > summary .cnt{font:500 12px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
details.grp > summary .cnt.full{color:var(--ok)}
details.grp > summary .arrow{color:var(--accent);transition:transform .15s}
details.grp[open] > summary .arrow{transform:rotate(90deg)}
details.grp > .body{padding:0 14px 10px;border-top:1px solid var(--line-2)}
details.grp details.sec{margin:10px 0 0}
.pick .more{flex:none;margin-left:auto;border:0;background:none;color:var(--accent);font-size:14px;padding:2px 4px;align-self:flex-start}
.pick .more[aria-expanded="true"]{transform:rotate(90deg)}
.pick .ex{margin-top:6px}
.pick .ex .text{max-height:50vh;overflow:auto;font-size:13px;line-height:1.55;border-top:1px solid var(--line-2);margin-top:6px;padding-top:4px}
.pick > div{flex:1;min-width:0}
</style>

<header class="top">
  <div class="row">
    <div class="brand"><span id="brand">Driveway Packet</span> <small id="ver"></small></div>
    <div class="topright"><span class="where" id="where">Loading</span><button class="pill quiet" id="hide" title="Hide completed">Hide completed</button><button class="pill quiet" id="ids" title="Show wording IDs">IDs</button><button class="pill quiet" id="reset" title="Clear everything and start a new client">Reset</button></div>
  </div>
  <div class="ticks" id="ticks"></div>
</header>

<main class="wrap" id="main">
  <h1>Loading the form catalog</h1>
  <p class="lede">One moment.</p>
</main>

<nav class="bottom">
  <div class="row">
    <button class="btn quiet" id="back">Back</button>
    <button class="pill accent" id="addform">+ Add a form</button>
    <span class="spacer"></span>
    <button class="btn primary" id="next">Next</button>
  </div>
</nav>

<script>
/* Configuration the business sets once. */
const RECIPIENT_EMAIL = "stephenzygielrealtor@gmail.com"; // only fills the wording's {email}; this page emails nothing
const BUSINESS = "Agents Back Office";
const TX = new URLSearchParams(location.search).get("tx") || null;   // editing an existing transaction: its id
const DRAFT_KEY = TX ? "driveway-packet-draft-v2:tx:" + TX : "driveway-packet-draft-v2";
let SESSION = null;    // the signed-in agent (ABO.sessionState): session + profile
let TXROW = null;      // the transaction being edited (TX mode)
let BASE_VERSION = 0;  // the newest version already on that transaction
// Page wording added by the portal build; P- ids show in ID mode like the U- ids and join the wording sheet.
const LOCAL_COPY = {
  "P-01": "Send to Agents Back Office",
  "P-02": "Sending…",
  "P-03": "Sent. Opening the transaction…",
  "P-04": "Tap again to update your profile",
  "P-05": "Update my profile too",
  "P-06": "Email is your sign-in address; it changes on the Profile page, not here.",
  "P-07": "We have it the moment you tap Send. It appears under Transactions with its status, and we email you when it moves.",
  "P-08": "Editing",
  "P-09": "changes go out as version",
  "P-10": "Back to the transaction",
  "P-12": "Your {fields} here {differ} from your profile. This packet uses what is typed here.",
  "P-13": "Could not send:",
  "P-14": "Transaction not found",
  "P-15": "Back to the portal"
};
const IDS_KEY = "driveway-packet-ids";

let CAT = null;            // catalog.json, from the private Storage bucket (ABO.catText)
let S = freshState();      // working state
const TEXT = {};           // verbatim text cache
const CTX = {};            // per-field legal wording cache
const SECTIONS = {};       // parsed sections per form
const OPEN_LW = new Set(); // open wording panels (formId|fieldId), kept across re-renders
const OPEN_GRP = {};       // open folding sections per page
let DOWNLOADS = undefined; // downloads capability: undefined = not resolved yet, null = unavailable
let IDMODE = false;

function freshState(){
  return { packet:null, agent:{name:"",license:"",phone:"",email:"",side:""}, shared:{}, parties:{buyers:[],sellers:[],tenants:[],landlords:[]}, selected:[], values:{}, editing:{}, step:0, createdAt:new Date().toISOString() };
}
function loadDraft(){ try{ const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(d && d.packet!==undefined) return d; }catch(e){} return null; }
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(S)); }catch(e){} }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

const $ = (s,r=document)=>r.querySelector(s);
const el = (tag, attrs={}, ...kids)=>{ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k==="html") e.innerHTML=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==null&&v!==undefined) e.setAttribute(k,v);} for(const k of kids.flat()){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); } return e; };

/* ---------- wording and its IDs ---------- */
// Page wording lives in catalog/copy.json (CAT.copy); every visible string carries an ID tag shown in ID mode.
function T(id){ let s=CAT&&CAT.copy?CAT.copy[id]:undefined; if(s==null) s=id; return s.replace(/\{email\}/g,RECIPIENT_EMAIL).replace(/\{business\}/g,BUSINESS); }
const ID = id => id ? el("span",{class:"idtag"}, id) : null;
const W = id => [T(id), ID(id)];
const PH = id => IDMODE ? `[${id}] ${T(id)}` : T(id);       // placeholders cannot hold a tag
function setIdMode(on){ IDMODE=!!on; document.body.classList.toggle("ids",IDMODE); $("#ids").classList.toggle("on",IDMODE); try{ localStorage.setItem(IDS_KEY, IDMODE?"1":""); }catch(e){} }
// Hide completed: filled fields and finished groups leave the screen so the unfinished ones can be scanned; a field keeps its place until the next render
const HIDE_KEY = "driveway-packet-hide"; let HIDE = false;
function setHide(on){ HIDE=!!on; document.body.classList.toggle("hide-done",HIDE); $("#hide").classList.toggle("on",HIDE); try{ localStorage.setItem(HIDE_KEY, HIDE?"1":""); }catch(e){} }
function doneClass(filled){ return filled && stepKind(S.step)!=="pick" ? " done" : ""; }
function fillBtn(b, id){ b.replaceChildren(...W(id)); }
// two-tap confirmation (the viewer has no confirm dialog)
function armConfirm(btn, armedId, action){
  if(btn.dataset.armed){ delete btn.dataset.armed; clearTimeout(btn._t); action(); return; }
  btn._orig=[...btn.childNodes]; btn.dataset.armed="1"; btn.replaceChildren(...W(armedId));
  btn._t=setTimeout(()=>{ delete btn.dataset.armed; btn.replaceChildren(...btn._orig); },4000);
}

/* ---------- catalog helpers ---------- */
const form = id => CAT.forms[id];
const pk = () => CAT.packets[S.packet];
const ACR = new Set(["FHA","VA","USDA","RPCD","HOA","TRR","LLC","ID","OREC","PMI","HUD","EPA","MLS","US","U.S."]);
const SMALL = new Set(["of","and","to","the","or","for","a","an","in","on","with","by","at","not","as","from"]);
function tc(s){ if(!s || s!==s.toUpperCase()) return s; return s.toLowerCase().split(/(\s+|—|-|\/)/).map((w,i)=>{ const u=w.toUpperCase(); if(ACR.has(u)) return u; if(!/^[a-z]/.test(w)) return w; if(i>0 && SMALL.has(w)) return w; return w[0].toUpperCase()+w.slice(1); }).join(""); }
const fcode = fm => fm.code || fm.formId;
function packetForms(){ const p=pk(); if(!p) return []; const order=[...(p.core||[]), ...Object.values(p.financingByType||{}).filter(Boolean), ...(p.rpcdExclusive||[]), ...(p.leadPaintWhenPre1978||[]), ...(p.companions||[]), ...(p.usual||[]), ...(p.optional||[])]; return [...new Set(order)].filter(id=>form(id)); }
function financingForm(){ const p=pk(); const t=S.shared["contract.financingType"]; return p&&p.financingByType? (p.financingByType[t]||null):null; }
function leadForms(){ const p=pk(); const v=S.shared["property.yearBuiltPre1978"]; return (p&&(v==="Yes"||v==="Unknown"))? (p.leadPaintWhenPre1978||[]):[]; }
function defaultSelection(){ const p=pk(); if(!p) return []; const ids=[...(p.core||[]), ...(p.companions||[]), ...(p.usual||[])]; const f=financingForm(); if(f) ids.push(f); ids.push(...leadForms()); return [...new Set(ids)]; }
function applyDrivers(){ const p=pk(); if(!p) return; const allFin=Object.values(p.financingByType||{}).filter(Boolean); const f=financingForm(); S.selected=S.selected.filter(id=>!allFin.includes(id) || id===f); if(f && !S.selected.includes(f)) S.selected.splice(Math.min(1,S.selected.length),0,f); const lead=p.leadPaintWhenPre1978||[]; const want=leadForms(); S.selected=S.selected.filter(id=>!lead.includes(id) || want.includes(id)); for(const id of want) if(!S.selected.includes(id)) S.selected.push(id); }
let _defs=null; function sharedDefs(){ if(_defs) return _defs; _defs={}; for(const g of CAT.shared) for(const f of g.fields) _defs[f.key]=f; return _defs; }
function partyJoin(list, prop){ return (S.parties[list]||[]).map(p=>(p[prop]||"").trim()).filter(Boolean).join(prop==="name"?", ":" / "); }
function defaultSide(packet){ const d=profileOf().represents_default; if(packet==="sale") return d==="seller"?"Seller":"Buyer"; return "Landlord"; }
function agentPrefix(){ const map=(CAT.agentSide||{})[S.packet]||{}; return map[S.agent.side]||null; }
function sharedValue(key){
  const v=S.shared[key]; if(v!==undefined && v!=="") return v;
  const d=sharedDefs()[key]||{};
  if(d.derived==="address"){ return [S.shared["property.street"], S.shared["property.city"]].map(x=>(x||"").trim()).filter(Boolean).join(", "); }
  if(d.type==="party-list") return partyJoin(d.party,"name");
  if(d.derivedFrom){ const [list,prop]=d.derivedFrom.split("."); return partyJoin(list,prop); }
  if(d.side){ const pre=agentPrefix(); if(pre && key.startsWith(pre+".")){ const part=key.split(".")[1]; const m={licensee:"name",license:"license",phone:"phone",email:"email"}[part]; if(m) return S.agent[m]||""; } }
  return d.default||"";
}
function briefFields(fm){ return fm.fields.filter(f=>f.brief!==false); }
function lineItems(fm){ const sets=new Set(); let n=0; for(const f of briefFields(fm)){ if(f.columnSet){ sets.add(f.columnSet); } else n++; } return n+sets.size; }
function signingFields(fm){ return fm.fields.filter(f=>f.brief===false); }
function prefillOf(f){ // what General Information supplies for this field; undefined when nothing
  if(f.compose) return f.compose.map(k=>sharedValue(k)).filter(Boolean).join(", ");
  if(!f.shared) return undefined;
  if(f.type==="checkbox") return f.sharedValue!==undefined ? (sharedValue(f.shared)===f.sharedValue) : undefined;
  return sharedValue(f.shared);
}
function getVal(fid, f){ const v=(S.values[fid]||{})[f.fieldId]; if(v!==undefined) return v; const p=prefillOf(f); if(p!==undefined) return p; return ""; }
function setVal(fid, f, v){ (S.values[fid] ||= {}); const p=prefillOf(f); if(p!==undefined && v===p) delete S.values[fid][f.fieldId]; else S.values[fid][f.fieldId]=v; saveDraft(); }
function isOverridden(fid,f){ return (S.values[fid]||{})[f.fieldId]!==undefined; }
// financing columns on the cost sheets: one line item is several catalog fields (column CONV/FHA/VA/ASSUMP/CASH);
// the page shows it once and keeps the amount in the column that matches General Information's Financing
const FIN_COL={"Conventional":"CONV","FHA":"FHA","VA":"VA","Assumption":"ASSUMP","Cash":"CASH","USDA Rural Housing":"FHA","Native American":"CONV","Seller financing":"CONV"}; // owner 2026-10-30: USDA in the FHA column; Seller financing in CONV; Native American in CONV until the owner confirms
function activeVariant(fid, variants){
  const fin=sharedValue("contract.financingType"); const want=FIN_COL[fin];
  const f=variants.find(v=>v.column===want) || variants[0];
  const vals=S.values[fid]||{};
  if(vals[f.fieldId]===undefined){ const other=variants.find(v=>v!==f && vals[v.fieldId]!==undefined); if(other){ vals[f.fieldId]=vals[other.fieldId]; delete vals[other.fieldId]; saveDraft(); } }
  return {f, fin, placed: want!==undefined && f.column===want};
}
function visibleFields(fid, fields){ // one entry per line item; a column set is represented by its active variant
  const out=[]; const seen={};
  for(const f of fields){ if(!f.columnSet){ out.push(f); continue; } if(seen[f.columnSet]) continue; seen[f.columnSet]=true; const vs=fields.filter(x=>x.columnSet===f.columnSet); const a=activeVariant(fid, vs); a.f._col=a; out.push(a.f); }
  return out;
}

// the § button and its panel: the sentence of the form this field fills, its blank highlighted
function legalBits(fid, fields){
  const key=fid+"|"+fields[0].fieldId;
  const panel=el("div",{class:"legal hidden"});
  const btn=el("button",{type:"button",class:"lw","aria-expanded":"false","aria-label":T("U-65"),title:T("U-65")},"§");
  const show=async open=>{
    btn.setAttribute("aria-expanded",open?"true":"false"); panel.classList.toggle("hidden",!open);
    if(!open){ OPEN_LW.delete(key); return; }
    OPEN_LW.add(key);
    const c=await loadCtx(fid);
    const seen=new Set(); const texts=[];
    for(const f of fields){ const t=c[f.fieldId]; if(t && !seen.has(t)){ seen.add(t); texts.push(t); } }
    panel.replaceChildren(el("div",{class:"cap"}, ...W("U-65")));
    if(texts.length){ for(const t of texts) for(const para of t.split(/\n\s*\n/)) if(para.trim()) panel.append(ctxPara(para)); panel.append(el("div",{class:"small",style:"margin-top:6px"}, ...W("U-66"))); }

  };
  btn.addEventListener("click",e=>{ e.preventDefault(); e.stopPropagation(); show(panel.classList.contains("hidden")); });
  if(OPEN_LW.has(key)) show(true);
  return {btn, panel};
}

function render(){

  if(f.hint) wrap.append(el("div",{class:"hint"}, f.hint, ID(f.uid+"h")));
  return wrap;
}

function renderReview(main){

      catch(e){ sendBtn.disabled=false; status.replaceChildren(T("P-13")+" "+((e&&e.message)||String(e))); } }}, ...W("P-01"));
  acts.append(sendBtn);

function buildPayload(){
  const forms=S.selected.map(id=>{ const fm=form(id); const values={}; for(const f of fm.fields){ if(f.brief===false) continue; const v=getVal(id,f); if(v==="" || v===undefined || v===null || v===false) continue; values[f.fieldId]=v; } return {formId:id, title:fm.title, edition:fm.edition, values}; });
  const shared={}; for(const g of CAT.shared) for(const d of g.fields){ const v=sharedValue(d.key); if(v!=="" && v!=null) shared[d.key]=v; }
  const parties={}; for(const [k,list] of Object.entries(S.parties)){ const l=(list||[]).filter(p=>(p.name||p.phone||p.email)); if(l.length) parties[k]=l; }
  return { kind:"driveway-packet", version:2, catalogVersion:CAT.catalogVersion, packet:S.packet, createdAt:S.createdAt, sentAt:new Date().toISOString(), agent:S.agent, shared, parties, forms };
}
function summaryText(p){ return `${BUSINESS} packet · ${pk().title}\nProperty: ${p.shared["property.identifier"]||p.shared["property.mls"]||"—"}\nAgent: ${p.agent.name||"—"} ${p.agent.phone||""}\nForms: ${p.forms.map(f=>tc(f.title)).join("; ")}`; }
async function deflateB64(str){
  if(typeof CompressionStream!=="function") return null;
  try{ const cs=new CompressionStream("deflate-raw"); const w=cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close(); const buf=await new Response(cs.readable).arrayBuffer(); let s=""; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }catch(e){ return null; }
}
async function packBody(p, json){ const b64=await deflateB64(json); return summaryText(p)+"\n\n"+(b64 ? "PKT1:"+b64 : json); }
function mailto(p, body){ const subj=encodeURIComponent(`Packet · ${p.shared["property.identifier"]||p.shared["property.mls"]||pk().title}`); let b=body; if(b.length>7000) b=summaryText(p)+"\n\n(The packet is too large for an email link. Tap Copy on the page and paste it here.)"; return `mailto:${RECIPIENT_EMAIL}?subject=${subj}&body=${encodeURIComponent(b)}`; }
async function resolveDownloads(){ if(DOWNLOADS!==undefined) return DOWNLOADS; try{ DOWNLOADS = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("downloads") : null; }catch(e){ DOWNLOADS=null; } return DOWNLOADS; }

/* ---------- the signed-in agent and their profile ---------- */
const PROFILE_MAP = {name:"full_name", license:"license_no", phone:"phone"}; // email is the sign-in address; it changes on the Profile page
function profileOf(){ return (SESSION && SESSION.profile) || {}; }
function prefillAgent(){ const p=profileOf(); const m={name:p.full_name, license:p.license_no, phone:p.phone, email:p.email}; for(const k in m){ if(!(S.agent[k]||"").trim() && m[k]) S.agent[k]=m[k]; } }
function profileDiff(){ const p=profileOf(); const d={}; for(const [k,col] of Object.entries(PROFILE_MAP)){ const v=(S.agent[k]||"").trim(); if(v && v!==(p[col]||"")) d[col]=v; } return d; }
function profileSync(body){
  const p=profileOf(); const d=profileDiff(); const keys=Object.keys(d);
  const emailDiff=(S.agent.email||"").trim() && (S.agent.email||"").trim()!==(p.email||"");
  if(!keys.length && !emailDiff) return;
  const wrap=el("div",{class:"hint",style:"margin-top:6px"});
  if(keys.length){
    const labels={full_name:"name", license_no:"license number", phone:"phone"};
    wrap.append(T("P-12").replace("{fields}", keys.map(k=>labels[k]).join(", ")).replace("{differ}", keys.length===1?"differs":"differ")+" ", ID("P-12"));
    wrap.append(el("button",{type:"button",class:"linkbtn", onclick:e=>armConfirm(e.currentTarget,"P-04",async()=>{
      const { error } = await ABO.sb.from("profiles").update(d).eq("id", SESSION.session.user.id);
      if(error){ wrap.append(el("div",{class:"small"}, "Could not update the profile: "+error.message)); return; }
      Object.assign(SESSION.profile, d); ABO.audit("profile_update", {from:"packet", fields:keys}); render(); })}, ...W("P-05")));
  }
  if(emailDiff) wrap.append(el("div",{class:"small"}, ...W("P-06")));
  body.append(wrap);
}

/* ---------- send: the transaction, its parties, and a new packet version ---------- */
const SIDE_COL={Buyer:"buyer", Seller:"seller", Landlord:"landlord", Tenant:"tenant"};
const PARTY_ROLE={buyers:"buyer", sellers:"seller", tenants:"tenant", landlords:"landlord"};
function keyDates(shared){ const out={}; const m={"contract.date":"contract", "contract.closingDate":"closing", "lease.startDate":"lease_start", "lease.endDate":"lease_end"}; for(const [k,name] of Object.entries(m)){ if(shared[k]) out[name]=shared[k]; } return out; }
async function sendPacket(payload){
  const sb=ABO.sb; const uid=SESSION.session.user.id;
  const label=payload.shared["property.identifier"]||payload.shared["property.mls"]||null;
  const address=["property.street","property.city","property.state","property.zip"].map(k=>(payload.shared[k]||"").trim()).filter(Boolean).join(", ")||null;
  const head={ property_label:label, property_address:address, side:SIDE_COL[payload.agent.side]||null, key_dates:keyDates(payload.shared) };
  let txId=TX;
  if(txId){ const { error } = await sb.from("transactions").update(head).eq("id", txId); if(error) throw error; }
  else { const { data, error } = await sb.from("transactions").insert({ ...head, agent_id:uid }).select("id").single(); if(error) throw error; txId=data.id; }
  // parties -> the agent's client list (matched by name, else email, else phone; new people are added) -> linked to the transaction
  const { data: mineData } = await sb.from("clients").select("id, full_name, email, phone"); const mine=mineData||[];
  const norm=x=>(x||"").trim().toLowerCase();
  for(const [list, role] of Object.entries(PARTY_ROLE)){
    for(const p of (payload.parties[list]||[])){
      const name=(p.name||"").trim(); if(!name) continue;
      let c=mine.find(c=>norm(c.full_name)===norm(name)) || (norm(p.email) && mine.find(c=>norm(c.email)===norm(p.email))) || (norm(p.phone) && mine.find(c=>norm(c.phone)===norm(p.phone)));
      if(!c){ const { data, error } = await sb.from("clients").insert({ agent_id:uid, full_name:name, phone:(p.phone||"").trim()||null, email:(p.email||"").trim()||null, role }).select("id, full_name, email, phone").single(); if(error) throw error; c=data; mine.push(c); }
      const { error } = await sb.from("transaction_clients").upsert({ transaction_id:txId, client_id:c.id, role }, { onConflict:"transaction_id,client_id", ignoreDuplicates:true }); if(error) throw error;
    }
  }
  // the version: content is append-only on the server; a resend is a new version number
  let vno=null; try{ const { data } = await sb.rpc("next_version_no", { t: txId }); if(typeof data==="number") vno=data; }catch(e){}
  if(vno==null){ const { data } = await sb.from("packet_versions").select("version_no").eq("transaction_id", txId).order("version_no",{ascending:false}).limit(1); vno=((data&&data[0]&&data[0].version_no)||0)+1; }
  const forms={}; for(const f of payload.forms) forms[f.formId]={ title:f.title, edition:f.edition, values:f.values };
  const answers={ kind:payload.kind, version:payload.version, packet:payload.packet, createdAt:payload.createdAt, sentAt:payload.sentAt, agent:payload.agent, shared:payload.shared, parties:payload.parties, forms };
  const { data: pv, error: e2 } = await sb.from("packet_versions").insert({ transaction_id:txId, agent_id:uid, version_no:vno, catalog_version:payload.catalogVersion, forms:payload.forms.map(f=>tc(f.title)), answers }).select("id").single(); if(e2) throw e2;
  ABO.audit("packet_sent", { transaction_id:txId, version_no:vno, forms:payload.forms.map(f=>f.formId) }, { type:"packet_version", id:pv.id });
  try{ await ABO.fn("notify", { event:"packet_received", packet_version_id:pv.id }); }catch(e){ /* the packet is saved; the email is a courtesy */ }
  return { transaction_id:txId, version_no:vno, id:pv.id };
}

/* ---------- editing an existing transaction (?tx=<id>): start from its newest version ---------- */
async function loadTransaction(){
  const sb=ABO.sb;
  const { data: t, error } = await sb.from("transactions").select("*").eq("id", TX).maybeSingle();
  if(error || !t){ $("#main").innerHTML=""; $("#main").append(el("h1",{}, ...W("P-14")), el("p",{class:"lede"}, el("a",{href:"/app/"}, ...W("P-15")))); where("Error"); return false; }
  TXROW=t;
  const { data: vs } = await sb.from("packet_versions").select("version_no, answers").eq("transaction_id", TX).order("version_no",{ascending:false}).limit(1);
  const v=vs&&vs[0]; BASE_VERSION=v?v.version_no:0;
  S=freshState();
  const a=v&&v.answers;
  if(a && a.packet && CAT.packets[a.packet]){
    S.packet=a.packet; S.agent=Object.assign(S.agent, a.agent||{}); S.shared=Object.assign({}, a.shared||{});
    S.parties=Object.assign({buyers:[],sellers:[],tenants:[],landlords:[]}, a.parties||{});
    S.selected=Object.keys(a.forms||{}).filter(id=>CAT.forms[id]);
    for(const id of S.selected){ S.values[id]=Object.assign({}, (a.forms[id]||{}).values||{}); for(const f of form(id).fields){ const val=S.values[id][f.fieldId]; if(val===undefined) continue; const p=prefillOf(f); if(p!==undefined && val===p) delete S.values[id][f.fieldId]; } }
    S.step=1;
  } else { // a transaction the back office opened by hand: seed General Information from its header
    S.shared["property.identifier"]=t.property_label||""; S.shared["property.street"]=t.property_address||"";
    const side={buyer:"Buyer", seller:"Seller", landlord:"Landlord", tenant:"Tenant"}[t.side]; if(side) S.agent.side=side;
  }
  saveDraft(); return true;
}
function txBanner(){
  if(!TX || !TXROW) return;
  const n=el("div",{class:"wrap",style:"padding-top:10px;padding-bottom:0"});
  n.append(el("div",{class:"hint"}, T("P-08")+" "+(TXROW.property_label||TXROW.property_address||"")+" · "+T("P-09")+" "+(BASE_VERSION+1)+" · ", ID("P-08"), ID("P-09"), el("a",{href:"/app/#t/"+TX}, ...W("P-10"))));

/* ---------- verbatim text & sections ---------- */
async function loadText(fid){ if(TEXT[fid]) return TEXT[fid]; try{ TEXT[fid]=await ABO.catText("text/"+fid+".md"); }catch(e){ TEXT[fid]="The full text could not be loaded here. The printed form governs."; } return TEXT[fid]; }
function parseSections(md){
  const secs=[]; let cur=null;
  for(const raw of md.split("\n")){
    const l=raw.replace(/\r$/,"");
    let h=null, m;
    if((m=l.match(/^#{1,6}\s+(.+)/))) h=m[1];
    else if((m=l.match(/^\*\*([^*]{2,120})\*\*\s*$/))) h=m[1];
    else if((m=l.match(/^\*\*((?:\d+|[A-Z])\.\s[^*]{2,120})\*\*/))) h=m[1];
    if(h!==null){ cur={title:h.trim(), lines:[l]}; secs.push(cur); continue; }
    if(cur) cur.lines.push(l);
  }
  return secs;
}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function sectionFor(fid, group){
  const md=TEXT[fid]; if(!md) return null;
  const secs = SECTIONS[fid] ||= parseSections(md);
  const num=(group.match(/^(\d+)\./)||[])[1];
  let hit=null;
  if(num) hit=secs.find(s=>new RegExp("^"+num+"\\.\\s").test(s.title));
  if(!hit){ const g=norm(group).slice(0,18); if(g.length>=6) hit=secs.find(s=>norm(s.title).startsWith(g)); }
  return hit ? hit.lines.join("\n") : null;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/_{4,}/g,"<mark>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mark>").replace(/\[ \]/g,"☐"); }
function mdToHtml(md){
  const out=[]; let para=[]; let table=[]; let list=[];
  const flush=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } if(table.length){ out.push("<pre>"+esc(table.join("\n"))+"</pre>"); table=[]; } if(list.length){ out.push("<ul>"+list.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>"); list=[]; } };
  for(const raw of md.split("\n")){
    const l=raw.replace(/\r$/,"");
    const li=l.match(/^\s*[-*]\s+(.+)/); if(li){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } list.push(li[1]); continue; } else if(list.length){ out.push("<ul>"+list.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>"); list=[]; }
    if(/^\s*\|/.test(l)){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } table.push(l); continue; } else if(table.length){ out.push("<pre>"+esc(table.join("\n"))+"</pre>"); table=[]; }
    const h=l.match(/^(#{1,6})\s+(.*)/); if(h){ flush(); out.push(`<h${Math.min(3,h[1].length)}>${inline(h[2])}</h${Math.min(3,h[1].length)}>`); continue; }
    if(/^>\s?/.test(l)){ flush(); out.push("<blockquote>"+inline(l.replace(/^>\s?/,""))+"</blockquote>"); continue; }
    if(!l.trim()){ flush(); continue; }
    para.push(l);
  }
  flush(); return out.join("");
}

  let saved=""; try{ saved=localStorage.getItem(IDS_KEY)||""; }catch(e){}

  CAT.copy=Object.assign(CAT.copy||{}, LOCAL_COPY);

  else if(TX){ const ok=await loadTransaction(); if(!ok) return; }
  prefillAgent();
  txBanner();
  render();
}
