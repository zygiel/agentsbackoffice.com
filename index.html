<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents Back Office</title>
<meta name="description" content="Agents Back Office. Coming soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Public+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f7f5f0;--fg:#1c2733;--muted:#5a6673;--accent:#8a5a2b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a21;--fg:#e8e4dc;--muted:#a2acb8;--accent:#d2965a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding-inline:16px;text-align:center}
main{max-width:34rem}
h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.15;margin:0 0 .6rem;letter-spacing:.005em}
p{margin:0;color:var(--muted);font-size:1.05rem}
.rule{width:3rem;height:2px;background:var(--accent);margin:1.2rem auto 0;border-radius:1px}
</style>
</head>
<body>
<main>
  <h1>Agents Back Office</h1>
  <p>Coming soon.</p>
  <div class="rule" aria-hidden="true"></div>
</main>
</body>
</html>
